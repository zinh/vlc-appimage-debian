name: Build VLC AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: VLC version to build (e.g. 3.0.23)
        required: true
        default: 3.0.23
      debian_suite:
        description: Debian release to take the VLC packages from (older = runs on more systems)
        type: choice
        options:
          - bookworm
          - trixie
        default: bookworm

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VLC_VERSION: ${{ inputs.version }}
      DEBIAN_SUITE: ${{ inputs.debian_suite }}
      APPIMAGE: VLC-${{ inputs.version }}-x86_64.AppImage
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VLC_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid version '$VLC_VERSION', expected something like 3.0.23"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Build AppImage
        run: ./build.sh "$VLC_VERSION" "$DEBIAN_SUITE"

      - name: Smoke test
        env:
          # runners have no FUSE; run the AppImage by extracting it
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./"$APPIMAGE" --version | tee version.txt
          grep -q "VLC version $VLC_VERSION " version.txt

          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=3:size=640x360:rate=25 \
            -f lavfi -i sine=duration=3 -c:v libx264 -c:a aac test.mp4
          timeout 60 ./"$APPIMAGE" -I dummy -V dummy -A dummy --play-and-exit -vv test.mp4 2>&1 \
            | tee play.log | grep -E "using (video|audio) decoder module" || true
          grep -q 'using video decoder module "avcodec"' play.log
          grep -q 'using audio decoder module' play.log

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vlc-$VLC_VERSION-$DEBIAN_SUITE"
          files=("$APPIMAGE")
          [[ -f "$APPIMAGE.zsync" ]] && files+=("$APPIMAGE.zsync")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "VLC $VLC_VERSION (Debian $DEBIAN_SUITE)" \
              --notes "VLC $VLC_VERSION AppImage for x86_64, built from Debian $DEBIAN_SUITE packages.

          Make it executable and run: \`chmod +x $APPIMAGE && ./$APPIMAGE\`"
          fi
